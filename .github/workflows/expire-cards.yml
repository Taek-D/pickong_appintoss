name: expire-cards
# 매월 1일 0시 KST = 매월 1일 15시 UTC (전일)
# 단순화: 매월 1일 15시 UTC + 1시간 6회 재시도
on:
  schedule:
    # cron: 매월 1일 15:00 UTC = 매월 2일 00:00 KST
    # 정확히 매월 1일 0시 KST를 노린다면 매월 0일 15시 = 전월 말일이 필요한데 cron L 미지원
    # → 차선: 매월 1일 15시 UTC (= 2일 0시 KST). 사용자에게 미공개 1일 동안 만료 대기.
    # ※ 정확도 우선시 별도 cron-job.org 같은 서비스 사용 권장 (Phase 4 결정)
    - cron: '0 15 1 * *'
  workflow_dispatch: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Run expire-cards (with 6x retry, 1h interval)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if pnpm --dir server exec tsx src/scripts/expire-cards.ts; then
              echo "expire-cards succeeded on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; sleeping 1h"
            sleep 3600
          done
          echo "expire-cards failed after 6 attempts"
          exit 1
